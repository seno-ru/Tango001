
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">

<!-- ⭐ スマホ対応（超重要） -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>英単語アプリ</title>

<style>
body {
  text-align: center;
  font-size: 20px; /* 基本文字 */
  margin: 10px;
}

/* 問題の文字（大きくする） */
#word {
  font-size: 20px;
  margin: 5px 0;
}

/* ボタンを大きく */
button {
  font-size: 20px;
  padding: 15px 20px;
  margin: 5px;
  width: 90%;
  max-width: 400px;
}
</style>
</head>

<body>

<h1 id="word">読み込み中...</h1>

<button onclick="showAnswer()">答えを見る</button>
<button onclick="showWord()">問題にもどる</button>

<button onclick="playVoice()">🔊 発音</button>

<button onclick="correct()">正解</button>
<button onclick="wrong()">不正解</button>

<button onclick="reset()">最初に戻る（完全リセット）</button>

<p id="status"></p>

<script>
let words = [];
let originalWords = [];
let index = 0;

// CSV読み込み
fetch("words.csv")
  .then(response => {
    if (!response.ok) {
      throw new Error("CSV読み込み失敗");
    }
    return response.text();
  })
  .then(data => {
    let lines = data.split("\n");

    originalWords = lines
      .filter(line => line.trim() !== "")
      .map(line => {
        let parts = line.split(",");
        return {
          en: parts[0],
          ja: parts[1]
        };
      });

    words = [...originalWords];
    showWord();
  })
  .catch(error => {
    console.error(error);
    document.getElementById("word").innerText =
      "読み込み失敗（GitHub Pagesで確認してください）";
  });

// 英語表示
function showWord() {
  if (words.length === 0) {
    document.getElementById("word").innerText = "全部クリア！";
    return;
  }

  index = index % words.length;
  document.getElementById("word").innerText = words[index].en;

  speak(words[index].en);

  document.getElementById("status").innerText =
    "残り：" + words.length + "問";
}

// 答え
function showAnswer() {
  document.getElementById("word").innerText = words[index].ja;
}

// 音声
function playVoice() {
  speak(words[index].en);
}

function speak(text) {
  let msg = new SpeechSynthesisUtterance(text);
  msg.lang = "en-US";
  speechSynthesis.speak(msg);
}

// 正解
function correct() {
  words.splice(index, 1);
  if (index >= words.length) index = 0;
  showWord();
}

// 不正解
function wrong() {
  index++;
  showWord();
}

// リセット
function reset() {
  words = [...originalWords];
  index = 0;
  showWord();
}
</script>

</body>
</html>
